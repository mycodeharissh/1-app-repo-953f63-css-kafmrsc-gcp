apiversion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.kafka.secretName }}
  namespace: {{ .Values.kafka.namespace }}
  annotations:
    strategy.harness.io/recreate: {{ .Values.certificatesRecreate | quote }}
spec:
  secretTemplate:
    annotations:
      moniker.harness.io/application: {{ .Values.kafka.application }}
      moniker.harness.io/cluster: {{.Values.kafka.cluster }}
  secretName: {{ .Values.kafka.secretName }}
  {{- if .Values.kafka.duration }}
  privateKey:
    algorithm: RSA
    size: 2048
  duration: {{ .Values.kafka.duration }}
  {{- end }}
  {{- if .Values.kafka.renewBefore }}
  renewBefore: {{ .values.kafka.renewBefore }}
  {{- end }}
  issuerRef:
    name: {{ .Values.kafka.issuerName }}
    kind: ClusterIssuer
    commonName: {{ .Values.kafka.commonName }}
    dnsnames:
    {{- range .Values.kafka.dnsNames }}
    - {{ . | quote }}
    {{- end -}}