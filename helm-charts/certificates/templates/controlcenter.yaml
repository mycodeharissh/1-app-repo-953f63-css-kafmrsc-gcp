apiversion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.controlcenter.secretName }}
  namespace: {{ .Values.controlcenter.namespace }}
  annotations:
    strategy.harness.io/recreate: {{ .Values.certificatesRecreate | quote }}
spec:
  secretTemplate:
    annotations:
      moniker.harness.io/application: {{ .Values.controlcenter.application }}
      moniker.harness.io/cluster: {{.Values.controlcenter.cluster }}
  secretName: {{ .Values.controlcenter.secretName }}
  {{- if .Values.controlcenter.duration }}
  privateKey:
    algorithm: RSA
    size: 2048
  duration: {{ .Values.controlcenter.duration }}
  {{- end }}
  {{- if .Values.controlcenter.renewBefore }}
  renewBefore: {{ .values.controlcenter.renewBefore }}
  {{- end }}
  issuerRef:
    name: {{ .Values.controlcenter.issuerName }}
    kind: ClusterIssuer
    commonName: {{ .Values.controlcenter.commonName }}
    dnsnames:
    {{- range .Values.controlcenter.dnsNames }}
    - {{ . | quote }}
    {{- end -}}