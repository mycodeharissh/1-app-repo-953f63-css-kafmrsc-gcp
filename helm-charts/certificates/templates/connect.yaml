apiversion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.connect.secretName }}
  namespace: {{ .Values.connect.namespace }}
  annotations:
    strategy.harness.io/recreate: {{ .Values.certificatesRecreate | quote }}
spec:
  secretTemplate:
    annotations:
      moniker.harness.io/application: {{ .Values.connect.application }}
      moniker.harness.io/cluster: {{.Values.connect.cluster }}
  secretName: {{ .Values.connect.secretName }}
  {{- if .Values.connect.duration }}
  privateKey:
    algorithm: RSA
    size: 2048
  duration: {{ .Values.connect.duration }}
  {{- end }}
  {{- if .Values.connect.renewBefore }}
  renewBefore: {{ .values.connect.renewBefore }}
  {{- end }}
  issuerRef:
    name: {{ .Values.connect.issuerName }}
    kind: ClusterIssuer
    commonName: {{ .Values.connect.commonName }}
    dnsnames:
    {{- range .Values.connect.dnsNames }}
    - {{ . | quote }}
    {{- end -}}